<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Hikari</title>
  <defs>
    <!-- Three stops rather than two, so the bright cyan stays in the bottom-right corner and the
         star head, which sits up and to the right, keeps a dark field behind it. A plain two-stop
         gradient put the white star on the light end and washed it out at small sizes. -->
    <linearGradient id="tile" x1="0.16" y1="0" x2="0.84" y2="1">
      <stop offset="0" stop-color="#131c46" />
      <stop offset="0.6" stop-color="#1b4f80" />
      <stop offset="1" stop-color="#3fe0ff" />
    </linearGradient>
    <linearGradient id="trail" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.22" />
    </linearGradient>
  </defs>

  <!-- 156 of 512 is the same 30% corner the app's brand mark already uses -->
  <rect width="512" height="512" rx="156" fill="url(#tile)" />

  <!-- Nagareboshi. The trail fades toward the tail so the eye reads a direction, which is what
       makes it a shooting star rather than a diagonal stripe. -->
  <path d="M318 166 A26 26 0 0 1 354 202 Q214 296 96 424 Q188 258 318 166 Z" fill="url(#trail)" />
  <path d="M336 100 Q352 178 434 194 Q352 210 336 288 Q320 210 238 194 Q320 178 336 100 Z" fill="#ffffff" />

  <circle cx="140" cy="168" r="14" fill="#ffffff" opacity="0.85" />
  <path d="M196 372 Q201 402 224 410 Q201 418 196 448 Q191 418 168 410 Q191 402 196 372 Z" fill="#ffffff" opacity="0.75" />
</svg>
